<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
<title>The Simple 3-Step Formula · Cat Shanu</title>
<style>
@font-face{font-family:"SFD";src:url(../assets/fonts/sfpro-bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Inter";src:url(../assets/fonts/inter-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--ink:#f6ede6;--ink2:#fffaf6;--red:#9b1b30;--red2:#a57a3c;--deep:#5c0f1f;--cream:#2b1218;--mute:rgba(43,18,24,.66);--line:rgba(43,18,24,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#000;color:var(--cream);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;overflow:hidden;container-type:size;background:var(--ink)}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--red);width:0;transition:width .3s ease;z-index:5}
#counter{position:fixed;right:14px;bottom:12px;z-index:5;font:12px/1 Inter,system-ui;color:var(--cream);opacity:.45;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;font:12px/1 Inter;color:var(--cream);opacity:.4;transition:opacity .6s}

/* type */
h1,h2,h3{font-family:SFD,"SF Pro Display",-apple-system,Inter,sans-serif;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.04}
.h1{font-size:6.2cqw}.h2{font-size:4.6cqw}.h3{font-size:3.3cqw}
p{margin:0}
.sub{font-size:1.9cqw;line-height:1.4;color:var(--mute);margin-top:2.6cqh;max-width:46ch}
.eye{font:600 1.15cqw/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:var(--red2);margin-bottom:3cqh}
.r{color:var(--red2)}
.brand{position:absolute;left:4cqw;top:5cqh;font:700 1.5cqw/1 SFD,Inter;color:var(--red2);letter-spacing:-.01em;z-index:3}

/* layouts */
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqh 9cqw}
.c .sub{margin-left:auto;margin-right:auto}
.redbg{background:var(--red)} .redbg .sub{color:rgba(255,255,255,.82)} .redbg .eye{color:#fff;opacity:.8}
.creambg{background:var(--cream);color:var(--ink)} .creambg .sub{color:rgba(14,13,13,.62)} .creambg .eye{color:var(--red)}
.full img.bg{position:absolute;top:0;right:0;width:56%;height:100%;object-fit:cover}
.full.rt img.bg{right:auto;left:0}
.full::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 44%,rgba(14,13,13,.55) 52%,rgba(14,13,13,0) 64%)}
.full.rt::after{background:linear-gradient(270deg,var(--ink) 0%,var(--ink) 44%,rgba(14,13,13,.55) 52%,rgba(14,13,13,0) 64%)}
.full .tx{position:absolute;z-index:2;left:6cqw;top:50%;transform:translateY(-50%);max-width:40cqw}
.full.rt .tx{left:auto;right:6cqw}
.split{display:grid;grid-template-columns:1fr 1fr;height:100%}
.split .ph{position:relative;overflow:hidden}
.split .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.split .tx{display:flex;flex-direction:column;justify-content:center;padding:0 6cqw}
.split.rev .ph{order:2}
.ph-frame{width:100%;height:100%;object-fit:cover;object-position:50% 15%;border-radius:1.4cqw}
.framed{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6cqw;padding:0 7cqw}
.framed .pic{height:72cqh;display:flex;align-items:center;justify-content:center}
.framed .pic img{max-height:72cqh;max-width:100%;border-radius:1.2cqw;box-shadow:0 3cqh 8cqh rgba(0,0,0,.5)}
.tilt{transform:rotate(-3deg)}
.pol{background:#fff;padding:1.2cqw 1.2cqw 5cqh;border-radius:.4cqw;box-shadow:0 3cqh 8cqh rgba(0,0,0,.5);transform:rotate(-4deg)}
.pol img{display:block;height:60cqh;width:auto;max-width:34cqw;object-fit:cover}
.cluster{display:flex;gap:2cqw;justify-content:center;align-items:center;margin-top:5cqh}
.cluster img{height:52cqh;width:auto;border-radius:1cqw;object-fit:cover;box-shadow:0 2cqh 6cqh rgba(0,0,0,.5)}
.cluster img:nth-child(2){transform:translateY(-3cqh)}
.cluster img:nth-child(odd){transform:rotate(-2deg)}

/* nodes */
.nodes{display:flex;align-items:flex-start;justify-content:center;gap:0;margin-top:9cqh;position:relative;width:100%}
.node{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;padding:0 1.2cqw}
.node .dot{width:7.4cqw;height:7.4cqw;border-radius:50%;background:var(--ink2);border:.25cqw solid var(--red);display:grid;place-items:center;font:700 2.6cqw SFD;color:var(--cream);position:relative;z-index:2}
.node:not(:last-child)::after{content:"";position:absolute;top:3.7cqw;left:50%;width:100%;height:.25cqw;background:linear-gradient(90deg,var(--red),rgba(70,2,33,.25));z-index:1}
.node b{display:block;font:700 1.9cqw/1.2 SFD;margin-top:3cqh}
.node span{display:block;font-size:1.35cqw;line-height:1.4;color:var(--mute);margin-top:1.2cqh;max-width:22ch}
.creambg .node .dot{background:#fff;color:var(--ink)} .creambg .node span{color:rgba(14,13,13,.6)}

/* cards */
.grid{display:grid;gap:1.6cqw;margin-top:7cqh;width:100%}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:1.2cqw;padding:3.4cqh 1.8cqw;text-align:left}
.card .n{font:700 1.2cqw SFD;color:var(--red2);letter-spacing:.1em}
.card b{display:block;font:700 1.9cqw/1.2 SFD;margin-top:1.4cqh}
.card span{display:block;font-size:1.3cqw;line-height:1.45;color:var(--mute);margin-top:1cqh}
.creambg .card{background:#fff;border-color:rgba(14,13,13,.08)} .creambg .card span{color:rgba(14,13,13,.6)}

/* myth */
.myth{display:grid;grid-template-columns:1fr 1fr;height:100%}
.myth>div{display:flex;flex-direction:column;justify-content:center;padding:0 6cqw}
.myth .m{background:var(--ink2)} .myth .m h2{color:rgba(245,239,233,.45);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:.35cqw}
.myth .t{background:var(--red)}
.myth .lab{font:600 1.2cqw Inter;letter-spacing:.2em;text-transform:uppercase;margin-bottom:3cqh;opacity:.75}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin-top:6cqh;width:100%}
.cmp .col{border-radius:1.2cqw;padding:3.6cqh 2.4cqw;text-align:left}
.cmp .a{background:var(--ink2);border:1px solid var(--line)} .cmp .a h3{color:rgba(245,239,233,.5)}
.cmp .b{background:var(--red)}
.cmp ul{list-style:none;margin:2.6cqh 0 0;padding:0}
.cmp li{font-size:1.65cqw;line-height:1.35;padding:1.5cqh 0;border-top:1px solid rgba(255,255,255,.14)}
.cmp .a li{color:var(--mute)}

/* quote */
.q{position:absolute;inset:0;display:grid;grid-template-columns:38cqw 1fr;align-items:center}
.q .ph{height:100%;position:relative}.q .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.q .tx{padding:0 7cqw}
.q blockquote{margin:0;font:700 3.4cqw/1.18 SFD;letter-spacing:-.015em}
.q cite{display:block;margin-top:4cqh;font:600 1.3cqw Inter;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:var(--red2)}
.stars{color:var(--red2);font-size:1.8cqw;letter-spacing:.3em;margin-bottom:3cqh}

/* chat prompt */
.chat{display:inline-flex;align-items:center;gap:1.2cqw;background:#fff;color:var(--ink);border-radius:5cqw;padding:2cqh 2.4cqw 2cqh 1.4cqw;margin-top:6cqh;box-shadow:0 2cqh 6cqh rgba(0,0,0,.35)}
.chat i{width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font:700 1.4cqw SFD;font-style:normal}
.chat b{font:700 2.4cqw SFD}
.caret{display:inline-block;width:.18cqw;height:2.6cqw;background:var(--red);margin-left:.4cqw;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}

/* quiz */
.quiz{display:flex;gap:2cqw;margin-top:7cqh}
.quiz div{width:22cqw;padding:3.6cqh 0;border-radius:1.2cqw;border:.2cqw solid var(--line);font:700 2.8cqw SFD;transition:all .5s}
.quiz .on{background:var(--red);border-color:var(--red)}
.quiz .off{opacity:.3}
.reveal{opacity:0;transform:translateY(2cqh);transition:all .6s;margin-top:5cqh}
.reveal.in{opacity:1;transform:none}

/* stack */
.stack{width:100%;margin-top:5cqh;display:flex;flex-direction:column;gap:1.2cqh}
.stack .row{display:flex;align-items:center;justify-content:space-between;background:var(--ink2);border:1px solid var(--line);border-radius:1cqw;padding:2.1cqh 2.2cqw;font:700 1.8cqw SFD;text-align:left}
.stack .row em{font:500 1.25cqw Inter;font-style:normal;color:var(--mute)}
.stack .row.bn{border-color:rgba(168,194,86,.6)}
.stack .row.bn em{color:var(--red2)}
.btn{display:inline-block;margin-top:6cqh;background:var(--red);color:#fff;font:700 2.2cqw SFD;padding:2.8cqh 4cqw;border-radius:5cqw;box-shadow:0 2cqh 6cqh rgba(70,2,33,.4)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:4cqw;padding:1.4cqh 2cqw;font-size:1.4cqw;color:var(--mute);margin-top:3cqh}

/* animations on mount */
.a1,.a2,.a3,.a4,.a5{opacity:0;transform:translateY(2.4cqh);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
.a2{animation-delay:.18s}.a3{animation-delay:.36s}.a4{animation-delay:.54s}.a5{animation-delay:.72s}
@keyframes up{to{opacity:1;transform:none}}
.zoom img.bg{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
html.reduced .a1,html.reduced .a2,html.reduced .a3,html.reduced .a4,html.reduced .a5{animation:none;opacity:1;transform:none}
html.reduced .zoom img.bg{animation:none}

/* demos */
.meter{width:70cqw;margin-top:8cqh;position:relative}
.meter .track{height:2.2cqh;border-radius:2cqh;background:linear-gradient(90deg,#3a3434,var(--red))}
.meter .lbls{display:flex;justify-content:space-between;margin-top:2.4cqh;font:600 1.5cqw Inter;color:var(--mute)}
.meter .needle{position:absolute;top:-2.4cqh;left:0;width:.5cqw;height:7cqh;background:var(--cream);border-radius:1cqw;transition:left 1.8s cubic-bezier(.3,.8,.2,1)}
.meter .tag{position:absolute;top:-9cqh;transform:translateX(-50%);font:700 1.6cqw SFD;background:var(--cream);color:var(--ink);padding:1cqh 1.2cqw;border-radius:.6cqw;white-space:nowrap;transition:left 1.8s cubic-bezier(.3,.8,.2,1)}
.kill{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;margin-top:6cqh;width:100%}
.kill div{background:var(--ink2);border:1px solid var(--line);border-radius:1cqw;padding:3cqh 1.4cqw;text-align:left;opacity:.15;transition:all .45s}
.kill div.on{opacity:1;border-color:rgba(168,194,86,.55)}
.kill div.big{background:var(--red);border-color:var(--red)}
.kill i{font:700 1.2cqw SFD;color:var(--red2);font-style:normal;letter-spacing:.1em}
.kill div.big i{color:#fff}
.kill b{display:block;font:700 1.75cqw/1.2 SFD;margin-top:1.2cqh}
.tri{width:84cqh;height:62cqh;margin-top:4cqh;overflow:visible}
.tri line{stroke:var(--red);stroke-width:3;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset 1s ease}
.tri.go line{stroke-dashoffset:0}
.tri circle{fill:var(--ink2);stroke:var(--red);stroke-width:3}
.tri text{fill:var(--cream);font:700 18px SFD,Inter;text-anchor:middle}
.tri .ctr{fill:var(--red2);font-size:13px;opacity:0;transition:opacity .6s 1.2s}
.tri.go .ctr{opacity:1}
.thermo{width:76cqw;margin-top:9cqh;position:relative}
.thermo .tube{height:3cqh;border-radius:3cqh;background:#2a2525;overflow:hidden}
.thermo .fill{height:100%;width:0;background:linear-gradient(90deg,#e8cfd6,var(--red));transition:width 3.2s cubic-bezier(.4,.1,.3,1)}
.thermo .steps{display:flex;justify-content:space-between;margin-top:3cqh}
.thermo .steps span{font:700 1.6cqw SFD;opacity:.25;transition:opacity .4s;width:20%;text-align:center}
.thermo .steps span.on{opacity:1}
.big{font:700 22cqh/1 SFD;color:var(--red2);letter-spacing:-.04em}
.pp{display:flex;gap:4cqw;align-items:center;margin-top:7cqh}
.pp div{width:20cqw;padding:4cqh 0;border-radius:1.2cqw;font:700 2.6cqw SFD;background:var(--ink2);border:1px solid var(--line)}
.pp .pull{animation:pull 2.4s ease-in-out infinite}
.pp .push{animation:push 2.4s ease-in-out infinite;background:var(--red);border-color:var(--red)}
@keyframes pull{50%{transform:translateX(3cqw)}}
@keyframes push{50%{transform:translateX(-3cqw)}}
html.reduced .pp div{animation:none}
.cover{height:66cqh;border-radius:1cqw;box-shadow:0 3cqh 8cqh rgba(0,0,0,.55);transform:rotate(-4deg)}
.shots{display:flex;gap:2.4cqw;justify-content:center;margin-top:5cqh}
.shots img{height:58cqh;border-radius:1.2cqw;box-shadow:0 3cqh 8cqh rgba(0,0,0,.5)}
.shots img:nth-child(1){transform:rotate(-3deg)}.shots img:nth-child(3){transform:rotate(3deg)}
.faq .q2{font:700 4.4cqw/1.12 SFD;max-width:20ch}
.faq .tag{font:600 1.2cqw Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--red2);margin-bottom:4cqh}

/* Cat's palette: champagne, blush, crimson, gold. Photos sit inside the slide, never next to a flat panel. */
body{background:#efe3da}
.redbg,.myth .t,.cmp .b,.quiz .on,.kill div.big,.pp .push,.btn{color:#fff}
.redbg{background:linear-gradient(135deg,#9b1b30,#6e1022)}
.creambg{background:#fffaf6;color:var(--cream)} .creambg .sub{color:var(--mute)}
.full::after,.full.rt::after{display:none}
.full img.bg{width:64%;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 14%,#000 38%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 14%,#000 38%)}
.full.rt img.bg{-webkit-mask-image:linear-gradient(270deg,transparent 0,rgba(0,0,0,.35) 14%,#000 38%);mask-image:linear-gradient(270deg,transparent 0,rgba(0,0,0,.35) 14%,#000 38%)}
.full .tx{max-width:38cqw}
.split{padding:7cqh 5cqw;gap:5cqw;box-sizing:border-box}
.split .ph{border-radius:1.6cqw;box-shadow:0 3cqh 8cqh rgba(92,15,31,.18)}
.split .tx{padding:0 2cqw}
.q{grid-template-columns:40cqw 1fr;padding-left:5cqw}
.q .ph{height:82cqh;border-radius:1.6cqw;overflow:hidden;box-shadow:0 3cqh 8cqh rgba(92,15,31,.18)}
.myth .m{background:#fffaf6} .myth .m h2{color:rgba(43,18,24,.4)}
.cmp .a h3{color:rgba(43,18,24,.45)} .cmp li{border-top-color:var(--line)} .cmp .b li{border-top-color:rgba(255,255,255,.2)}
.stack .row.bn,.kill div.on{border-color:rgba(165,122,60,.6)}
.meter .track{background:linear-gradient(90deg,#e6d3c8,var(--red))}
.thermo .tube{background:#eadacf}
.card,.stack .row,.kill div,.pp div{box-shadow:0 1.4cqh 4cqh rgba(92,15,31,.06)}
.chat{color:var(--cream)}
.shots img{height:auto;max-height:58cqh;max-width:27cqw;object-fit:contain}
.framed .pic img,.cluster img,.shots img,.pol,.cover{box-shadow:0 3cqh 8cqh rgba(92,15,31,.2)}
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="bar"></div>
<div id="counter"></div>
<div id="hint">Click, or press → to advance</div>

<script>
const DECK = (function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.documentElement.classList.add('reduced');
  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const counter = document.getElementById('counter');
  let current = 0, SLIDES = [];
  function show(i){
    if (!SLIDES.length) return;
    current = Math.max(0, Math.min(SLIDES.length - 1, i));
    const s = SLIDES[current];
    const el = document.createElement('section');
    el.className = 'slide';
    el.innerHTML = (typeof s === 'string') ? s : (s.html || '');
    stage.replaceChildren(el);
    if (s && typeof s.onMount === 'function') s.onMount(el, { reduced });
    bar.style.width = (current / Math.max(1, SLIDES.length - 1) * 100) + '%';
    counter.textContent = (current + 1) + ' / ' + SLIDES.length;
    if (current > 0) document.getElementById('hint').style.opacity = 0;
  }
  const next = () => show(current + 1);
  const prev = () => show(current - 1);
  addEventListener('keydown', e => {
    if (['ArrowRight',' ','Spacebar','PageDown'].includes(e.key)){ e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
    else if (e.key === 'Home'){ show(0); }
    else if (e.key === 'End'){ show(SLIDES.length - 1); }
  });
  addEventListener('click', e => { (e.clientX < innerWidth * 0.33 ? prev : next)(); });
  function load(slides){ SLIDES = slides || []; show((+new URLSearchParams(location.search).get('s')||1)-1); }
  return { load, show, next, prev, reduced };
})();

/* ---------- slide builders (design + copy live here) ---------- */
const I = n => `../assets/img/deck/${n}?v=4`;
const P = {
  sea:'c-sea.jpg', red:'c-red.jpg', red2:'c-red2.jpg', red3:'c-red3.jpg', tea:'c-tea.jpg', desk:'c-desk.jpg', flowers:'c-flowers.jpg',
  champ:'c-champ.jpg', dinner:'c-dinner.jpg', square:'c-square.jpg', close:'c-close.jpg', paris:'c-paris.jpg', yoga:'c-yoga.jpg'
};
const B = `<div class="brand">the femme guide.</div>`;
const eye = t => t ? `<div class="eye a1">${t}</div>` : '';
const sub = t => t ? `<p class="sub a3">${t}</p>` : '';

const full = (img, h, s, o={}) => `<div class="full zoom ${o.rt?'rt':''}" style="position:absolute;inset:0">
  <img class="bg" src="${I(P[img]||img)}" alt="" style="object-position:${o.pos||'50% 15%'}">
  <div class="tx">${eye(o.eye)}<h2 class="${o.size||'h2'} a2">${h}</h2>${sub(s)}</div></div>`;
const split = (img, h, s, o={}) => `<div class="split ${o.rev?'rev':''}">
  <div class="ph"><img src="${I(P[img]||img)}" alt="" style="object-position:${o.pos||'50% 15%'}"></div>
  <div class="tx">${eye(o.eye)}<h2 class="${o.size||'h2'} a2">${h}</h2>${sub(s)}</div></div>`;
const text = (h, s, o={}) => `<div class="c ${o.bg||''}">${B}${eye(o.eye)}<h1 class="${o.size||'h1'} a2">${h}</h1>${sub(s)}</div>`;
const divider = (n, h, s) => `<div class="c redbg"><div class="eye a1">${n}</div><h1 class="h1 a2" style="font-size:8cqw">${h}</h1>${sub(s)}</div>`;
const framed = (img, h, s, o={}) => `<div class="framed ${o.bg||''}" ${o.bg?'style="position:absolute;inset:0"':''}>
  <div class="tx" style="text-align:left">${eye(o.eye)}<h2 class="h2 a2">${h}</h2>${sub(s)}</div>
  <div class="pic a3"><img class="${o.tilt?'tilt':''}" src="${I(img)}" alt=""></div></div>`;
const polaroid = (img, h, s, o={}) => `<div class="framed"><div class="tx" style="text-align:left">${eye(o.eye)}<h2 class="h2 a2">${h}</h2>${sub(s)}</div>
